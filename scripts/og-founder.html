<!-- The founder page's link-preview picture (public/og-founder.png, 1440×740), shown when
     axihex.com/background is shared. To change it: edit this file, then from the project folder run
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=5000 --window-size=1440,740 --screenshot=public/og-founder.png "file://$PWD/scripts/og-founder.html" -->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:740px;overflow:hidden}
body{background:#0d1117;color:#e6edf3;font-family:Inter,system-ui,sans-serif;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
.g1{width:620px;height:620px;left:-160px;top:-220px;background:rgb(99 102 241/.38)}
.g2{width:520px;height:520px;right:120px;bottom:-260px;background:rgb(34 211 238/.20)}
.g3{width:520px;height:520px;right:60px;top:60px;background:rgb(99 102 241/.30)}
.wrap{position:absolute;inset:0;padding:72px 88px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-family:'Space Grotesk';font-weight:700;font-size:34px;letter-spacing:-.01em}
.brand svg{width:40px;height:40px;fill:none;stroke:#8b93f9;stroke-width:1.8;stroke-linejoin:round}
.brand svg circle{fill:#8b93f9;stroke:none}
.main{margin-top:auto;margin-bottom:auto;max-width:820px}
.eyebrow{color:#8b93f9;font-weight:600;font-size:22px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px}
h1{font-family:'Space Grotesk';font-weight:700;font-size:112px;line-height:1.02;letter-spacing:-.03em}
h1 span{background:linear-gradient(90deg,#8b93f9,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
p.intro{margin-top:28px;font-size:30px;line-height:1.4;color:#c9d1d9;max-width:700px}
.foot{display:flex;gap:18px;align-items:center;font-size:22px;color:#969da6}
.foot strong{color:#e6edf3;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:#30363d}
.avatar{position:absolute;right:110px;bottom:0;height:640px}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<img class="avatar" src="../public/avatar.webp" alt="">
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 24 24"><path d="M12 2.5 20.2 7.25v9.5L12 21.5 3.8 16.75v-9.5Z"/><circle cx="12" cy="12" r="2.6"/></svg>Axihex</div>
  <div class="main">
    <div class="eyebrow">Software Engineer · Founder of Axihex</div>
    <h1>Meet<br><span>Ali Chahine</span></h1>
    <p class="intro">Backend systems, AI integration, mobile development, and cloud infrastructure.</p>
  </div>
  <div class="foot"><strong>axihex.com/background</strong><span class="dot"></span><span>Open to engineering opportunities</span></div>
</div>
</body></html>
