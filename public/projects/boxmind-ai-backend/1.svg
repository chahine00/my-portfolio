<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <text x="80" y="110" fill="#e8eef6" font-size="44" font-weight="700">boxMind AI · Backend Platform</text>
  <text x="80" y="158" fill="#8fa6c0" font-size="24">Architecture I designed and owned as the first backend engineer</text>

  <g font-size="26" font-weight="600">
    <rect x="80" y="210" width="1040" height="78" rx="14" fill="#1e3a5c" stroke="#3b6ea5"/>
    <text x="110" y="258" fill="#e8eef6">Clients · web apps · AI team services</text>

    <rect x="80" y="306" width="1040" height="78" rx="14" fill="#1e3a5c" stroke="#3b6ea5"/>
    <text x="110" y="354" fill="#e8eef6">API layer · FastAPI / Flask</text>
    <text x="1090" y="354" fill="#8fa6c0" font-size="20" font-weight="500" text-anchor="end">versioned REST endpoints</text>

    <rect x="80" y="402" width="1040" height="78" rx="14" fill="#2a2440" stroke="#8b6fd6"/>
    <text x="110" y="450" fill="#e8eef6">Security · JWT auth · RBAC guards</text>
    <text x="1090" y="450" fill="#b9a8ec" font-size="20" font-weight="500" text-anchor="end">validation · rate limiting</text>

    <rect x="80" y="498" width="505" height="78" rx="14" fill="#1e3a5c" stroke="#3b6ea5"/>
    <text x="110" y="546" fill="#e8eef6">Services · business logic</text>

    <rect x="615" y="498" width="505" height="78" rx="14" fill="#173f3a" stroke="#3fae95"/>
    <text x="645" y="546" fill="#e8eef6">LLM layer · prompts</text>

    <rect x="80" y="594" width="1040" height="78" rx="14" fill="#1e3a5c" stroke="#3b6ea5"/>
    <text x="110" y="642" fill="#e8eef6">Data · MySQL schema &amp; models</text>
    <text x="1090" y="642" fill="#8fa6c0" font-size="20" font-weight="500" text-anchor="end">AWS (Lambda · API Gateway · EC2)</text>
  </g>
</svg>
