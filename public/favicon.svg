<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- A coffee mug (for "Coffee & A Warm Welcome") whose steam rises as a </> code tag. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- steam: < / > -->
  <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20,10 14,16.5 20,23"/>
    <line x1="30" y1="9" x2="25" y2="24"/>
    <polyline points="35,10 41,16.5 35,23"/>
  </g>

  <!-- mug -->
  <path d="M12 29 H42 V41 A11 11 0 0 1 31 52 H23 A11 11 0 0 1 12 41 Z" fill="#fff"/>
  <path d="M42 33 H45.5 A6.5 6.5 0 0 1 45.5 46 H41" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- coffee surface -->
  <rect x="15" y="31.5" width="24" height="3.5" rx="1.75" fill="#c08457"/>
  <!-- saucer -->
  <rect x="8" y="55" width="42" height="3.6" rx="1.8" fill="#fff" opacity="0.85"/>
</svg>
