<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iPhones and iPads use this PNG when the site is added to the home screen (they ignore SVG icons). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells browsers the site has its own light AND dark colors, so phones (e.g. Chrome on Android)
         don't "auto-darken" it on their own, which recolors the text and breaks the dark theme. -->
    <meta name="color-scheme" content="light dark" />
    <title>Ali Chahine</title>
    <meta name="description" content="Software engineer building scalable backends and AI-powered features. Python, FastAPI, Node.js, AWS, LLMs." />

    <!-- Link previews (LinkedIn, WhatsApp, X…). The image needs the full address so every app can find it. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ali Chahine — Software Engineer" />
    <meta property="og:description" content="Scalable backends and AI-powered features." />
    <meta property="og:image" content="https://chahine00.github.io/my-portfolio/og-image.png" />
    <meta property="og:url" content="https://chahine00.github.io/my-portfolio/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Space Grotesk, the font for titles (see --font-display in global.css). Only the weights used: 600 and 700.
         display=swap: the text shows right away in the normal font, then switches when the font has loaded. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

    <!-- Applies a light/dark choice made with the toggle BEFORE the page is drawn, so it doesn't flash.
         The choice is saved with the device's mode at that moment ("system"). Once the device switches
         mode (e.g. the phone goes dark at night), the choice is dropped and the site follows the device again.
         Older saves (just "light" or "dark") are dropped too, so everyone starts following their device. -->
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('theme') || 'null')
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (saved && (saved.theme === 'light' || saved.theme === 'dark') && saved.system === system) {
          document.documentElement.dataset.theme = saved.theme
        } else {
          localStorage.removeItem('theme')
        }
      } catch {
        try { localStorage.removeItem('theme') } catch {}
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
