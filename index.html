<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The site's icon: the Axihex mark (a hexagon with a dot) in the brand gradient, on a dark rounded tile, so it
         stands out on light and dark browser tabs. The SVG stays sharp at any size; the PNGs are for browsers that
         don't take SVG icons: 48px for tabs, 192px for sharper places (Android, bookmarks, Google's brand logo).
         The PNGs are made from the SVG with scripts/favicon.html. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <!-- iPhones and iPads use this PNG when the site is added to the home screen (they fill see-through parts with
         black and round the corners themselves, so this one is a full dark square with the mark in the middle). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tells browsers the site has its own light AND dark colors, so phones (e.g. Chrome on Android)
         don't "auto-darken" it on their own, which recolors the text and breaks the dark theme. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Title, description, link previews and structured data: filled in for each page by
         scripts/seo-plugin.ts (the text lives in src/data/seo.ts). Keep these two comments. -->
    <!-- seo:start -->
    <!-- seo:end -->
    <meta name="author" content="Ali Chahine" />

    <!-- Space Grotesk, the font for titles (see --font-display in global.css). Only the weights used: 600 and 700.
         display=swap: the text shows right away in the normal font, then switches when the font has loaded. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

    <!-- Applies a light/dark choice made with the toggle BEFORE the page is drawn, so it doesn't flash.
         The choice is saved with the device's mode at that moment ("system"). Once the device switches
         mode (e.g. the phone goes dark at night), the choice is dropped and the site follows the device again.
         Older saves (just "light" or "dark") are dropped too, so everyone starts following their device. -->
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('theme') || 'null')
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (saved && (saved.theme === 'light' || saved.theme === 'dark') && saved.system === system) {
          document.documentElement.dataset.theme = saved.theme
        } else {
          localStorage.removeItem('theme')
        }
      } catch {
        try { localStorage.removeItem('theme') } catch {}
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
